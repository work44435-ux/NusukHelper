
name: Build Nusuk Helper APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o NusukHelper-Download.zip -d extracted
          ls -la extracted/NusukHelper

      - name: Build APK
        run: gradle --no-daemon -p extracted/NusukHelper :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NusukHelper-APK
          path: extracted/NusukHelper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
